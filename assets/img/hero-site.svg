<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="ht">
  <title id="ht">Illustration of a wood-framed house under construction beside a finished home, with a safety checklist and a declining claims chart</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6E1EE"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D3DF"/>
      <stop offset="1" stop-color="#E6EBF1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12284C" flood-opacity=".18"/>
    </filter>
    <clipPath id="frame"><rect x="20" y="20" width="600" height="500" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="600" height="500" fill="url(#sky)"/>
    <!-- moon -->
    <circle cx="330" cy="92" r="30" fill="#FFFFFF" opacity=".9"/>
    <circle cx="330" cy="92" r="46" fill="#FFFFFF" opacity=".25"/>
    <!-- Sierra ridge -->
    <path d="M20 318 L70 292 L112 300 L168 262 L208 280 L262 236 L300 214 L336 246 L372 232 L420 268 L468 246 L520 276 L566 260 L620 282 V440 H20 Z" fill="#C3CFDD"/>
    <path d="M262 236 L300 214 L336 246 L322 240 L306 226 L292 236 Z" fill="#E9EEF5"/>
    <path d="M168 262 L184 252 L196 262 L184 260 Z" fill="#E9EEF5"/>
    <path d="M20 360 L110 338 L230 352 L360 330 L500 350 L620 336 V440 H20 Z" fill="#D5DEE8"/>

    <!-- ground -->
    <rect x="20" y="440" width="600" height="80" fill="url(#ground)"/>
    <rect x="20" y="438" width="600" height="4" fill="#12284C" opacity=".15"/>

    <!-- finished home (right) -->
    <g>
      <rect x="566" y="288" width="16" height="36" fill="#12284C" opacity=".8"/>
      <rect x="444" y="340" width="156" height="100" fill="#DCE3EC"/>
      <path d="M430 346 L522 282 L614 346 Z" fill="#12284C"/>
      <rect x="430" y="342" width="184" height="6" fill="#12284C" opacity=".35"/>
      <!-- garage -->
      <rect x="454" y="378" width="62" height="62" fill="#B9C6D6"/>
      <g stroke="#12284C" stroke-opacity=".3" stroke-width="1.5">
        <line x1="454" y1="393" x2="516" y2="393"/><line x1="454" y1="408" x2="516" y2="408"/><line x1="454" y1="423" x2="516" y2="423"/>
      </g>
      <!-- door & window -->
      <rect x="530" y="392" width="22" height="48" fill="#12284C" opacity=".85"/>
      <rect x="562" y="362" width="28" height="26" fill="#FFFFFF"/>
      <path d="M576 362 V388 M562 375 H590" stroke="#12284C" stroke-opacity=".4" stroke-width="1.5"/>
      <rect x="506" y="318" width="32" height="20" fill="#FFFFFF" opacity=".9"/>
      <!-- shrubs -->
      <circle cx="440" cy="436" r="12" fill="#9FB0C4"/>
      <circle cx="604" cy="434" r="14" fill="#9FB0C4"/>
      <circle cx="592" cy="438" r="10" fill="#B3C1D2"/>
    </g>

    <!-- slab -->
    <rect x="58" y="428" width="326" height="14" fill="#9AA8B8"/>
    <rect x="58" y="428" width="326" height="3" fill="#B5C0CD"/>

    <!-- wood-framed wall -->
    <g fill="#12284C">
      <!-- bottom plate, double top plate -->
      <rect x="66" y="420" width="310" height="8"/>
      <rect x="66" y="322" width="310" height="6"/>
      <rect x="66" y="329" width="310" height="6"/>
      <!-- studs -->
      <rect x="68" y="335" width="5" height="85"/>
      <rect x="86" y="335" width="5" height="85"/>
      <rect x="104" y="335" width="5" height="85"/>
      <rect x="122" y="335" width="5" height="85"/>
      <rect x="140" y="335" width="5" height="85"/>
      <!-- window opening: king/jack studs, header, sill, cripples -->
      <rect x="148" y="335" width="5" height="85"/>
      <rect x="153" y="356" width="4" height="64"/>
      <rect x="219" y="356" width="4" height="64"/>
      <rect x="223" y="335" width="5" height="85"/>
      <rect x="153" y="348" width="70" height="8"/>
      <rect x="157" y="392" width="62" height="5"/>
      <rect x="170" y="397" width="4" height="23"/>
      <rect x="186" y="397" width="4" height="23"/>
      <rect x="202" y="397" width="4" height="23"/>
      <rect x="186" y="335" width="4" height="13"/>
      <rect x="244" y="335" width="5" height="85"/>
      <rect x="262" y="335" width="5" height="85"/>
      <!-- door opening -->
      <rect x="280" y="335" width="5" height="85"/>
      <rect x="285" y="350" width="4" height="70"/>
      <rect x="323" y="350" width="4" height="70"/>
      <rect x="327" y="335" width="5" height="85"/>
      <rect x="285" y="342" width="42" height="8"/>
      <rect x="350" y="335" width="5" height="85"/>
      <rect x="368" y="335" width="5" height="85"/>
    </g>
    <!-- temporary diagonal brace -->
    <line x1="75" y1="420" x2="140" y2="338" stroke="#12284C" stroke-width="3" opacity=".55"/>
    <line x1="244" y1="420" x2="276" y2="338" stroke="#12284C" stroke-width="3" opacity=".55"/>

    <!-- gable-end roof truss -->
    <g stroke="#12284C" stroke-linecap="square" fill="none">
      <path d="M58 322 L221 226 L384 322" stroke-width="7"/>
      <line x1="58" y1="318" x2="384" y2="318" stroke-width="5"/>
      <g stroke-width="3">
        <line x1="221" y1="232" x2="221" y2="318"/>
        <line x1="140" y1="318" x2="140" y2="276"/>
        <line x1="302" y1="318" x2="302" y2="276"/>
        <line x1="140" y1="318" x2="182" y2="252"/>
        <line x1="302" y1="318" x2="260" y2="252"/>
      </g>
    </g>
    <!-- truss gusset plates -->
    <g fill="#FFFFFF" opacity=".8">
      <rect x="215" y="228" width="12" height="8"/>
      <rect x="135" y="313" width="10" height="7"/>
      <rect x="297" y="313" width="10" height="7"/>
    </g>

    <!-- ladder, extending above the top plate -->
    <g stroke="#12284C" stroke-width="3.5" stroke-linecap="round">
      <line x1="410" y1="440" x2="378" y2="298"/>
      <line x1="426" y1="440" x2="394" y2="298"/>
      <g stroke-width="2.5">
        <line x1="405.9" y1="422" x2="421.9" y2="422"/>
        <line x1="401.0" y1="400" x2="417.0" y2="400"/>
        <line x1="396.0" y1="378" x2="412.0" y2="378"/>
        <line x1="391.1" y1="356" x2="407.1" y2="356"/>
        <line x1="386.1" y1="334" x2="402.1" y2="334"/>
        <line x1="381.2" y1="312" x2="397.2" y2="312"/>
      </g>
    </g>

    <!-- lumber stack -->
    <g>
      <rect x="236" y="448" width="150" height="9" fill="#B5C0CD"/>
      <rect x="244" y="457" width="140" height="9" fill="#9AA8B8"/>
      <rect x="236" y="466" width="150" height="9" fill="#B5C0CD"/>
      <rect x="250" y="475" width="10" height="7" fill="#12284C" opacity=".6"/>
      <rect x="360" y="475" width="10" height="7" fill="#12284C" opacity=".6"/>
    </g>
  </g>

  <!-- floating card: claims trend -->
  <g filter="url(#sh)" transform="translate(28 120)">
    <rect width="168" height="112" rx="14" fill="#FFFFFF"/>
    <text x="16" y="28" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#12284C">OPEN CLAIMS</text>
    <g fill="#12284C">
      <rect x="18" y="52" width="16" height="44" rx="2" opacity=".35"/>
      <rect x="42" y="60" width="16" height="36" rx="2" opacity=".45"/>
      <rect x="66" y="66" width="16" height="30" rx="2" opacity=".6"/>
      <rect x="90" y="76" width="16" height="20" rx="2" opacity=".8"/>
      <rect x="114" y="84" width="16" height="12" rx="2"/>
    </g>
    <path d="M26 46 L50 55 L74 62 L98 71 L122 79 L144 74" fill="none" stroke="#12284C" stroke-width="2"/>
    <path d="M140 68 L148 73 L141 80" fill="none" stroke="#12284C" stroke-width="2"/>
  </g>

  <!-- hard hat badge -->
  <g filter="url(#sh)" transform="translate(28 424) scale(.8)">
    <circle cx="44" cy="44" r="44" fill="#12284C"/>
    <path d="M20 56 C20 38 30 27 44 27 C58 27 68 38 68 56 Z" fill="#FFFFFF"/>
    <rect x="15" y="55" width="58" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="41" y="23" width="6" height="18" rx="2" fill="#12284C" opacity=".25"/>
  </g>

  <!-- floating card: site audit -->
  <g filter="url(#sh)" transform="translate(436 96)">
    <rect width="176" height="150" rx="14" fill="#FFFFFF"/>
    <text x="18" y="30" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#12284C">SITE AUDIT</text>
    <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#1B2330">
      <g transform="translate(18 50)">
        <rect width="16" height="16" rx="4" fill="#12284C"/><path d="M4 8.5 L7 11.5 L12.5 5" stroke="#fff" stroke-width="2" fill="none"/>
        <text x="26" y="12">Fall protection</text>
      </g>
      <g transform="translate(18 76)">
        <rect width="16" height="16" rx="4" fill="#12284C"/><path d="M4 8.5 L7 11.5 L12.5 5" stroke="#fff" stroke-width="2" fill="none"/>
        <text x="26" y="12">Ladder setup</text>
      </g>
      <g transform="translate(18 102)">
        <rect width="16" height="16" rx="4" fill="#12284C"/><path d="M4 8.5 L7 11.5 L12.5 5" stroke="#fff" stroke-width="2" fill="none"/>
        <text x="26" y="12">Heat illness plan</text>
      </g>
      <g transform="translate(18 128)">
        <rect x=".75" y=".75" width="14.5" height="14.5" rx="4" fill="none" stroke="#12284C" stroke-width="1.5"/>
        <text x="26" y="12" fill="#5B6676">Toolbox talk</text>
      </g>
    </g>
  </g>
</svg>
