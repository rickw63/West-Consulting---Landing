<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="ht">
  <title id="ht">Illustration of a structural steel building under construction with a tower crane, a safety checklist and a declining claims chart</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE6F2"/>
      <stop offset="1" stop-color="#F4F7FB"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D3DF"/>
      <stop offset="1" stop-color="#E6EBF1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12284C" flood-opacity=".18"/>
    </filter>
    <clipPath id="frame"><rect x="20" y="20" width="600" height="500" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="600" height="500" fill="url(#sky)"/>
    <!-- sun -->
    <circle cx="500" cy="110" r="46" fill="#FFFFFF" opacity=".75"/>
    <!-- distant skyline -->
    <g fill="#B9C6D6">
      <rect x="20" y="300" width="46" height="140"/>
      <rect x="72" y="270" width="36" height="170"/>
      <rect x="112" y="320" width="54" height="120"/>
      <rect x="470" y="290" width="40" height="150"/>
      <rect x="516" y="250" width="50" height="190"/>
      <rect x="572" y="310" width="48" height="130"/>
    </g>
    <g fill="#D3DCE7">
      <rect x="80" y="282" width="6" height="6"/><rect x="94" y="282" width="6" height="6"/>
      <rect x="80" y="298" width="6" height="6"/><rect x="94" y="298" width="6" height="6"/>
      <rect x="526" y="264" width="6" height="6"/><rect x="540" y="264" width="6" height="6"/><rect x="554" y="264" width="6" height="6"/>
      <rect x="526" y="280" width="6" height="6"/><rect x="540" y="280" width="6" height="6"/><rect x="554" y="280" width="6" height="6"/>
    </g>

    <!-- ground -->
    <rect x="20" y="440" width="600" height="80" fill="url(#ground)"/>
    <rect x="20" y="438" width="600" height="4" fill="#12284C" opacity=".15"/>

    <!-- concrete foundation / slab -->
    <rect x="178" y="424" width="270" height="18" fill="#9AA8B8"/>
    <rect x="178" y="424" width="270" height="4" fill="#B5C0CD"/>

    <!-- steel frame building -->
    <g stroke="#12284C" stroke-linecap="square">
      <!-- columns -->
      <g stroke-width="8">
        <line x1="196" y1="424" x2="196" y2="196"/>
        <line x1="262" y1="424" x2="262" y2="196"/>
        <line x1="328" y1="424" x2="328" y2="196"/>
        <line x1="394" y1="424" x2="394" y2="250"/>
        <line x1="430" y1="424" x2="430" y2="304"/>
      </g>
      <!-- beams -->
      <g stroke-width="7">
        <line x1="192" y1="358" x2="434" y2="358"/>
        <line x1="192" y1="304" x2="434" y2="304"/>
        <line x1="192" y1="250" x2="398" y2="250"/>
        <line x1="192" y1="196" x2="332" y2="196"/>
      </g>
      <!-- cross bracing -->
      <g stroke-width="2.5" opacity=".55">
        <line x1="196" y1="424" x2="262" y2="358"/><line x1="262" y1="424" x2="196" y2="358"/>
        <line x1="328" y1="304" x2="394" y2="250"/><line x1="394" y1="304" x2="328" y2="250"/>
        <line x1="196" y1="250" x2="262" y2="196"/><line x1="262" y1="250" x2="196" y2="196"/>
      </g>
    </g>
    <!-- floor decks -->
    <g fill="#12284C" opacity=".12">
      <rect x="196" y="358" width="238" height="66"/>
      <rect x="196" y="304" width="198" height="54"/>
    </g>
    <!-- guardrail at top level -->
    <g stroke="#12284C" stroke-width="2" opacity=".7">
      <line x1="196" y1="178" x2="328" y2="178"/>
      <line x1="196" y1="187" x2="328" y2="187"/>
      <line x1="218" y1="178" x2="218" y2="196"/>
      <line x1="262" y1="178" x2="262" y2="196"/>
      <line x1="306" y1="178" x2="306" y2="196"/>
    </g>

    <!-- tower crane -->
    <g stroke="#12284C" fill="none">
      <!-- mast -->
      <g stroke-width="3">
        <line x1="112" y1="440" x2="112" y2="92"/>
        <line x1="130" y1="440" x2="130" y2="92"/>
      </g>
      <g stroke-width="1.6" opacity=".8">
        <path d="M112 440 L130 420 L112 400 L130 380 L112 360 L130 340 L112 320 L130 300 L112 280 L130 260 L112 240 L130 220 L112 200 L130 180 L112 160 L130 140 L112 120 L130 100"/>
      </g>
      <!-- jib -->
      <g stroke-width="3">
        <line x1="60" y1="92" x2="470" y2="92"/>
        <line x1="130" y1="78" x2="470" y2="92"/>
      </g>
      <g stroke-width="1.4" opacity=".75">
        <path d="M150 92 L165 79 L185 92 L205 80 L225 92 L245 81 L265 92 L285 82 L305 92 L325 83 L345 92 L365 85 L385 92 L405 86 L425 92 L445 88"/>
      </g>
      <!-- cab top -->
      <line x1="121" y1="92" x2="121" y2="52" stroke-width="3"/>
      <line x1="121" y1="52" x2="60" y2="92" stroke-width="1.6"/>
      <line x1="121" y1="52" x2="300" y2="90" stroke-width="1.6"/>
    </g>
    <rect x="58" y="92" width="34" height="22" fill="#12284C"/>
    <rect x="114" y="94" width="24" height="18" rx="2" fill="#12284C"/>
    <rect x="119" y="98" width="14" height="8" fill="#DCE6F2"/>
    <!-- trolley, cable & load -->
    <rect x="352" y="92" width="18" height="8" fill="#12284C"/>
    <line x1="361" y1="100" x2="361" y2="186" stroke="#12284C" stroke-width="1.6"/>
    <path d="M361 186 L340 200 M361 186 L382 200" stroke="#12284C" stroke-width="1.6"/>
    <g fill="#12284C">
      <rect x="326" y="200" width="70" height="4"/>
      <rect x="359" y="204" width="4" height="10"/>
      <rect x="326" y="214" width="70" height="4"/>
    </g>
  </g>

  <!-- floating card: safety checklist -->
  <g filter="url(#sh)" transform="translate(438 318)">
    <rect width="176" height="150" rx="14" fill="#FFFFFF"/>
    <text x="18" y="30" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#12284C">SITE AUDIT</text>
    <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#1B2330">
      <g transform="translate(18 50)">
        <rect width="16" height="16" rx="4" fill="#12284C"/><path d="M4 8.5 L7 11.5 L12.5 5" stroke="#fff" stroke-width="2" fill="none"/>
        <text x="26" y="12">Fall protection</text>
      </g>
      <g transform="translate(18 76)">
        <rect width="16" height="16" rx="4" fill="#12284C"/><path d="M4 8.5 L7 11.5 L12.5 5" stroke="#fff" stroke-width="2" fill="none"/>
        <text x="26" y="12">Rigging &amp; lifts</text>
      </g>
      <g transform="translate(18 102)">
        <rect width="16" height="16" rx="4" fill="#12284C"/><path d="M4 8.5 L7 11.5 L12.5 5" stroke="#fff" stroke-width="2" fill="none"/>
        <text x="26" y="12">Silica controls</text>
      </g>
      <g transform="translate(18 128)">
        <rect x=".75" y=".75" width="14.5" height="14.5" rx="4" fill="none" stroke="#12284C" stroke-width="1.5"/>
        <text x="26" y="12" fill="#5B6676">Toolbox talk</text>
      </g>
    </g>
  </g>

  <!-- floating card: claims trend -->
  <g filter="url(#sh)" transform="translate(28 150)">
    <rect width="168" height="112" rx="14" fill="#FFFFFF"/>
    <text x="16" y="28" font-family="Archivo, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#12284C">OPEN CLAIMS</text>
    <g fill="#12284C">
      <rect x="18" y="52" width="16" height="44" rx="2" opacity=".35"/>
      <rect x="42" y="60" width="16" height="36" rx="2" opacity=".45"/>
      <rect x="66" y="66" width="16" height="30" rx="2" opacity=".6"/>
      <rect x="90" y="76" width="16" height="20" rx="2" opacity=".8"/>
      <rect x="114" y="84" width="16" height="12" rx="2"/>
    </g>
    <path d="M26 46 L50 55 L74 62 L98 71 L122 79 L144 74" fill="none" stroke="#12284C" stroke-width="2"/>
    <path d="M140 68 L148 73 L141 80" fill="none" stroke="#12284C" stroke-width="2"/>
  </g>

  <!-- hard hat badge -->
  <g filter="url(#sh)" transform="translate(470 150)">
    <circle cx="44" cy="44" r="44" fill="#12284C"/>
    <path d="M20 56 C20 38 30 27 44 27 C58 27 68 38 68 56 Z" fill="#FFFFFF"/>
    <rect x="15" y="55" width="58" height="7" rx="3.5" fill="#FFFFFF"/>
    <rect x="41" y="23" width="6" height="18" rx="2" fill="#12284C" opacity=".25"/>
  </g>
</svg>
